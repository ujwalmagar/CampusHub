{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-white border-0 pt-4 pb-0 text-center">
                <i class="fa-solid fa-graduation-cap fa-3x text-primary mb-3"></i>
                <h3 class="font-weight-bold text-dark">Welcome Back</h3>
                <p class="text-muted">Login to CampusHub</p>
            </div>
            <div class="card-body p-4 pt-2">
                {% if form.errors %}
                    <div class="alert alert-danger d-flex align-items-center">
                        <i class="fa-solid fa-triangle-exclamation me-2"></i>
                        <div>Invalid username or password. Please try again.</div>
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label font-weight-500 text-dark">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0" required autofocus placeholder="Enter your username">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label font-weight-500 text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0" required placeholder="Enter your password">
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary py-2 font-weight-bold">Login to Account</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">Don't have an account? <a href="{% url 'signup' %}" class="text-primary text-decoration-none font-weight-bold">Sign up here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
