{% extends 'base.html' %}

{% block content %}
<div class="main-container container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Cancel Event</h5>
                </div>
                <div class="card-body text-center p-5">
                    <i class="fas fa-exclamation-triangle text-warning fa-3x mb-3"></i>
                    <h4>Are you sure you want to cancel "{{ object.title }}"?</h4>
                    <p class="text-muted mt-2">
                        This action will set the event status to CANCELLED. Students will no longer be able to register.
                    </p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'event_manage' %}" class="btn btn-outline-light px-4">Go Back</a>
                            <button type="submit" class="btn btn-danger px-4">Yes, Cancel Event</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
