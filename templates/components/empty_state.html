<div class="empty-state">
    <i class="{{ icon|default:'fa-solid fa-folder-open' }} mb-3"></i>
    <h5>{{ title|default:'No data available' }}</h5>
    <p class="text-muted">{{ message|default:'There is currently nothing to display here.' }}</p>
    {% if action_url %}
        <a href="{{ action_url }}" class="btn btn-primary mt-2">{{ action_text|default:'Take Action' }}</a>
    {% endif %}
</div>
