{% extends 'base.html' %}

{% block content %}
<div class="main-container container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Delete Volunteer Task</h5>
                </div>
                <div class="card-body text-center p-5">
                    <i class="fas fa-trash-alt text-danger fa-3x mb-3"></i>
                    <h4>Are you sure you want to delete "{{ object.task_name }}"?</h4>
                    <p class="text-muted mt-2">
                        Assigned to: {{ object.student.name }}<br>
                        Event: {{ object.event.title }}
                    </p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <a href="{% url 'volunteer_manage' %}" class="btn btn-outline-light px-4">Go Back</a>
                            <button type="submit" class="btn btn-danger px-4">Yes, Delete Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
